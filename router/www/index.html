<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Интернет</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="intro">

<!-- Splash: the photo full-bleed for a moment, then it settles into the
     background and the controls fade in. Driven purely by CSS animation so a
     JS failure can never leave the page stuck behind it. -->
<div class="splash" id="splash" aria-hidden="true"></div>

<main class="wrap">

  <!-- Status: the single most important thing on the page. -->
  <section class="status" id="status" aria-live="polite">
    <div class="lamp" id="lamp"><div class="lamp-dot"></div></div>
    <h1 class="headline" id="headline">Проверяем…</h1>
    <p class="sub" id="sub">Подождите несколько секунд</p>
  </section>

  <!-- Actions -->
  <section class="actions">
    <button class="btn btn-primary" id="btn-reconnect" type="button">
      <span class="btn-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
        </svg>
      </span>
      <span class="btn-text">
        <span class="btn-title">Переподключиться</span>
        <span class="btn-note">Если интернет медленный или сайты не открываются</span>
      </span>
    </button>

    <button class="btn" id="btn-reload" type="button">
      <span class="btn-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/>
        </svg>
      </span>
      <span class="btn-text">
        <span class="btn-title">Перезапустить</span>
        <span class="btn-note">Если переподключение не помогло</span>
      </span>
    </button>

    <button class="btn" id="btn-update" type="button">
      <span class="btn-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12"/><path d="M7.5 10.5 12 15l4.5-4.5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
        </svg>
      </span>
      <span class="btn-text">
        <span class="btn-title">Проверить обновления</span>
        <span class="btn-note" id="update-note">Загрузить последнюю версию программы</span>
      </span>
    </button>

    <button class="btn" id="btn-country" type="button">
      <span class="btn-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/><path d="M3 12h18"/>
          <path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/>
        </svg>
      </span>
      <span class="btn-text">
        <span class="btn-title">Выбрать страну</span>
        <span class="btn-note" id="country-note">Если сайт не открывается — попробуйте другую</span>
      </span>
    </button>

    <button class="btn btn-danger" id="btn-reboot" type="button">
      <span class="btn-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M5.5 5.5a9 9 0 1 0 13 0"/><path d="M12 2v9"/>
        </svg>
      </span>
      <span class="btn-text">
        <span class="btn-title">Перезагрузить роутер</span>
        <span class="btn-note">Крайняя мера. Интернет пропадёт на 2 минуты</span>
      </span>
    </button>
  </section>

  <p class="foot">
    <span id="foot-node">—</span>
    <span id="foot-version">—</span>
  </p>

</main>

<!-- Busy overlay: blocks double-taps while an action runs. -->
<div class="overlay" id="overlay" hidden>
  <div class="overlay-card">
    <div class="spinner" aria-hidden="true"></div>
    <p class="overlay-text" id="overlay-text">Переподключаемся…</p>
    <p class="overlay-note">Это займёт несколько секунд.<br>Не выключайте роутер.</p>
  </div>
</div>

<!-- Country picker -->
<div class="overlay" id="countries" hidden>
  <div class="overlay-card sheet">
    <p class="sheet-title">Выберите страну</p>
    <p class="sheet-note">Сайт заблокирован в одной стране — попробуйте другую.</p>
    <div class="sheet-list" id="country-list"></div>
    <button class="btn sheet-close" id="country-close" type="button">Закрыть</button>
  </div>
</div>

<!-- Reboot confirmation: this one kicks everybody off, so it is not one tap. -->
<div class="overlay" id="confirm" hidden>
  <div class="overlay-card confirm-card">
    <p class="confirm-title">Перезагрузить роутер?</p>
    <p class="overlay-note">
      Интернет и Wi-Fi пропадут примерно на 2 минуты.<br>
      Роутер включится сам.
    </p>
    <div class="confirm-actions">
      <button class="btn btn-danger confirm-yes" id="confirm-yes" type="button">Да, перезагрузить</button>
      <button class="btn confirm-no" id="confirm-no" type="button">Отмена</button>
    </div>
  </div>
</div>

<!-- Result toast -->
<div class="toast" id="toast" hidden role="status"></div>

<script src="app.js"></script>
</body>
</html>
